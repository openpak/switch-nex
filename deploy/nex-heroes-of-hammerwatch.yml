# Merge this router/service into the existing tcp maps in dynamic.yml.
# The console entrypoint and PROXY v2 match production's Switch NEX routes.
tcp:
  routers:
    nex-heroes-of-hammerwatch:
      entryPoints: [console]
      rule: "HostSNI(`g2075e100-lp1.s.n.srv.nintendo.net`)"
      service: nex-heroes-of-hammerwatch
      tls:
        passthrough: true
  services:
    nex-heroes-of-hammerwatch:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: "host.containers.internal:23110"

# Merge this router/service into the existing tcp maps in dynamic.yml.
# The console entrypoint and PROXY v2 match production's Switch NEX routes.
tcp:
  routers:
    nex-full-metal-furies:
      entryPoints: [console]
      rule: "HostSNI(`g2c82ee00-lp1.s.n.srv.nintendo.net`)"
      service: nex-full-metal-furies
      tls:
        passthrough: true
  services:
    nex-full-metal-furies:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: "host.containers.internal:23120"

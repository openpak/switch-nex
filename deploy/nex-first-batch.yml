# Merge these routers/services into the existing tcp maps in dynamic.yml.
# The console entrypoint and PROXY v2 match production's Switch NEX routes.
tcp:
  routers:
    nex-castle-crashers-remastered:
      entryPoints: [console]
      rule: "HostSNI(`g2458d100-lp1.s.n.srv.nintendo.net`)"
      service: nex-castle-crashers-remastered
      tls:
        passthrough: true
    nex-nobody-saves-the-world:
      entryPoints: [console]
      rule: "HostSNI(`g2ca9e100-lp1.s.n.srv.nintendo.net`)"
      service: nex-nobody-saves-the-world
      tls:
        passthrough: true
    nex-pico-park:
      entryPoints: [console]
      rule: "HostSNI(`g2c3c9a00-lp1.s.n.srv.nintendo.net`)"
      service: nex-pico-park
      tls:
        passthrough: true
  services:
    nex-castle-crashers-remastered:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: "host.containers.internal:23060"
    nex-nobody-saves-the-world:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: "host.containers.internal:23070"
    nex-pico-park:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: "host.containers.internal:23080"
